<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de uma Secundarista | Meu Blog</title>
    <style>
        /* ==========================================
           1. VARIÁVEIS DE CORES (PALETA HARMONIOSA)
           ========================================== */
        :root {
            /* Modo Claro (Lilás Pastel) */
            --bg-body: #f3e8ff;
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, #a855f7, #7e22ce);
            --bg-footer: #eae5f2;
            --text-primary: #3b0764;
            --text-body: #4a5568;
            --text-secondary: #8b5cf6;
            --header-title-color: #ffffff;
            --title-color: #9333ea;
            --time-color: #c026d3;
            --border-color: #f3e8ff;
            --shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.8);
            --btn-text: #6b21a8;
            --btn-border: #d8b4fe;
        }

        /* Modo Escuro Harmonioso */
        body.dark-mode {
            --bg-body: #0f0e17;        /* Fundo bem escuro com toque de violeta */
            --bg-card: #1a1829;        /* Card tom azul/roxo noturno */
            --bg-header: linear-gradient(135deg, #a855f7, #c084fc); /* Gradiente claro para destacar texto preto */
            --bg-footer: #12101d;
            --text-primary: #f3e8ff;    
            --text-body: #cbd5e1;       
            --text-secondary: #c084fc;  
            --header-title-color: #000000; /* Título do cabeçalho PRETO no modo escuro */
            --title-color: #000000;        /* Títulos dos posts PRETO no modo escuro */
            --time-color: #f472b6;      
            --border-color: #2e2a4a;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(26, 24, 41, 0.8);
            --btn-text: #e9d5ff;
            --btn-border: #4c1d95;
        }

        /* Estilos Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-body);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Botão de Alternar Tema */
        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--btn-bg);
            backdrop-filter
